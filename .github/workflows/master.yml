name: Main Workflow
on: 
  push:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Code checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: npm

    - name: Markdown link check
      run: >-
        find README.md source -name '*.md' -type f
        -exec npx --yes markdown-link-check@3.13.7
        --config .github/markdown-link-check.json --quiet {} \;

    - name: Build dependencies
      run: auto/build

    - name: Deploy to GitHub Pages
      env:
        GH_ACTION_DEPLOY_KEY: ${{secrets.GH_ACTION_DEPLOY_KEY}}
      run: auto/deploy
