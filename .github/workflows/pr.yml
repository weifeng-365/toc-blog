name: Pull Request Workflow
on: 
  pull_request

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
    - name: Code checkout
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'

    - name: Markdown link check
      run: >-
        find README.md source -name '*.md' -type f
        -exec npx --yes markdown-link-check@3.13.7
        --config .github/markdown-link-check.json --quiet {} \;
